name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 仓库只入库测试配置，config.yaml 属本地运行配置（由 config.sample.yaml 复制）
      SBA_CONFIG: tests/config.test.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit & integration tests (offline)
        run: pytest -q
      - name: Golden evaluation (fixtures, offline)
        run: python eval/run_eval.py --fixtures
      - name: Config self-check (dry run)
        run: |
          python -m app.tools.ocr_selfcheck --dry-run
          python -m app.tools.llm_selfcheck --dry-run
